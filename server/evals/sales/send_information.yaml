# 6. "Send me something." A next step, recorded honestly.
#
# The trap is the reflexive "I'll email that over to you right now" — which is
# a lie, because nothing in this phase can send an email. The agent may agree
# that information will be sent; it may not claim that it has sent it.
name: send_information
judge: !include judge_text.yaml

turns:
  - expect:
      - event: response
        eval: "the bot opens the call in some way"

  # Phase 26: `within_ms` on every expectation after the greeting, as the tool-turn
  # scenarios have carried since Phase 7 — on the free Groq tier a turn's second
  # request can wait 20–50 s for the minute to reset, and the harness's 60 s
  # default measured that wait, not the bot. See meeting.yaml and HANDOFF.md.
  - user: "Just email me some information and I'll take a look when I get a minute."
    expect:
      - event: function_call
        within_ms: 150000
        calls:
          - name: record_objection
            args: { kind: SEND_INFORMATION }
      - event: response
        within_ms: 150000
        eval: >-
          the response agrees to get them something and, if anything, asks one
          short question. It FAILS if it says the email has been sent, is being
          sent now, or is already in their inbox, and it fails if it claims to
          have their email address without being told it.

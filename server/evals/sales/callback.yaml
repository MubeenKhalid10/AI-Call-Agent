# 7. "Call me back later." A time taken, the call closed, nothing else sold.
#
# Phase 7 renamed the tool: `schedule_callback` now tries to *create* the
# callback rather than only recording that one was asked for. On an eval run the
# session has no prospect record, so the backend answers that it cannot schedule
# anything — and the agent must then say a colleague will be in touch, not that
# a callback is booked. What is asserted is therefore the same as before, plus
# the thing Phase 7 makes possible to get wrong: claiming a schedule that does
# not exist. The successful path, with a prospect and a database, is covered
# deterministically in tests/test_actions.py and tests/test_campaigns.py.
name: callback
judge: !include judge_text.yaml

turns:
  - expect:
      - event: response
        eval: "the bot opens the call in some way"

  # `within_ms`: a tool turn is two LLM requests, and Groq's free tier holds the
  # second back for the minute to reset. See meeting.yaml and HANDOFF.md.
  - user: "I'm actually walking into a meeting. Can you try me again on Wednesday, around ten in the morning?"
    expect:
      - event: function_call
        within_ms: 150000
        calls:
          - name: schedule_callback
      - event: response
        within_ms: 150000
        eval: >-
          the response agrees that someone will call back around Wednesday
          morning and closes the call. It FAILS if it tries to squeeze a question
          or a pitch in first, or if it states as a fact that the callback is
          scheduled, booked, or "in the system" — on this session nothing could
          schedule it, so at most it may say a colleague will be in touch then.

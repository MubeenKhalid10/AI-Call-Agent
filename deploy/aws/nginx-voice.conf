# nginx: the one public HTTPS/WSS address of the AI Call Agent on the EC2 host.
#
# <YOUR_HOSTNAME> is substituted by setup-ec2.sh, which installs this file as
# /etc/nginx/sites-available/ai-agent-voice once the certificate exists.
#
# Everything on this hostname is forwarded to the bot's runner (`uv run bot.py`)
# on loopback port 7860: the carrier's call audio (wss .../ws), the browser
# client the Vercel Live Agent page frames (/client, /api/offer), the carrier's
# status webhooks (/webhooks/telephony) and the probes (/healthz, /readyz).
# app.py (7900: engine, outbox, dashboard) stays on loopback; Vercel serves the UI.
#
# No `root` and no `alias` anywhere: nginx serves no file from disk except the
# ACME challenge directory, so .env and the checkout cannot be reached through it.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate limit for the routes that start a browser session (and so STT/LLM/TTS
# spending). Keyed on POST only: WebRTC trickles its ICE candidates as PATCH
# requests to the same path, and those must not be throttled. An empty key is
# not counted. One connection costs at most two POSTs (/start + the offer).
map $request_method $aiagent_session_key {
    default "";
    POST    $binary_remote_addr;
}
limit_req_zone $aiagent_session_key zone=aiagent_session:10m rate=12r/m;

server {
    listen 80;
    listen [::]:80;
    server_name <YOUR_HOSTNAME>;
    server_tokens off;

    # Let's Encrypt renewals (certbot --webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name <YOUR_HOSTNAME>;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/<YOUR_HOSTNAME>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<YOUR_HOSTNAME>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:aiagent:10m;
    ssl_session_timeout 1d;

    # The bot receives SDP offers and carrier webhooks (a few KB). Knowledge-base
    # uploads go to the application on Vercel, not here.
    client_max_body_size 1m;

    # The Prometheus scrape routes stay private (MONITORING_TOKEN is not set).
    location = /metrics      { return 404; }
    location = /metrics.json { return 404; }

    # nginx is the only proxy in front, so the client address is set, not
    # appended: a forged X-Forwarded-For from outside is discarded. The bot
    # trusts these from loopback (SECURITY_TRUSTED_PROXIES default 127.0.0.0/8).
    # (A location that sets any proxy header inherits none, hence the repetition.)

    # A call's websocket carries audio both ways every 20 ms, so it is never
    # idle while it lives; the bot itself ends a call at MAX_CALL_SECS (600 s
    # by default, 7200 s at most) and an idle session at 300 s. The timeout
    # only has to outlast those, and must not be nginx's 60 s default, which
    # would cut a browser session that is connected but momentarily silent.
    proxy_read_timeout    7500s;
    proxy_send_timeout    7500s;
    proxy_connect_timeout 5s;
    # Audio frames and streamed responses go out as they arrive.
    proxy_buffering off;

    # The carrier's media stream. Carriers send no Origin header, and the runner
    # rejects a missing Origin once PIPECAT_ALLOWED_ORIGINS is set (the bot unit
    # sets it), so this route, and only this route, is given the production
    # origin here. `= /ws` and `/ws/` do not match the browser's /ws-client.
    location = /ws {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin            "https://<YOUR_HOSTNAME>";
    }
    location ^~ /ws/ {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin            "https://<YOUR_HOSTNAME>";
    }

    # Session-starting routes: rate limited per client address (POST only, above).
    location = /api/offer {
        limit_req zone=aiagent_session burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /start {
        limit_req zone=aiagent_session burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /sessions/ {
        limit_req zone=aiagent_session burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else the bot serves: /client, /webhooks/telephony, /healthz,
    # /readyz, /ws-client. The Origin header is passed through untouched, so the
    # runner's own origin check applies to every browser route.
    location / {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

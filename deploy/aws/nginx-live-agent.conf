# nginx: the public HTTPS/WSS site of the AI Call Agent on the EC2 host.
# Installed as /etc/nginx/sites-available/ai-agent-voice (this is the copy of
# what is deployed on hashmaker-ai-agent.duckdns.org).
#
# Forwarded to the bot's runner on loopback 7860:
#   /client/, /start, /sessions/   the browser client the Vercel Live Agent page frames
#   /ws, /ws/<token>               the carrier's call audio (wss), telephony
#   /webhooks/telephony            the carrier's status webhooks (signature-checked by the bot)
#   /healthz, /readyz              probes
# Everything else, including /metrics, /api/offer and app.py on 7900, is 404.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# /readyz opens a database connection for every request, and the Supabase session
# pooler allows 15 clients in all (shared with Vercel).
limit_req_zone $binary_remote_addr zone=live_agent_start:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=live_agent_sessions:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;

    server_name hashmaker-ai-agent.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name hashmaker-ai-agent.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/hashmaker-ai-agent.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hashmaker-ai-agent.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    # SDP offers and carrier webhooks are a few KB.
    client_max_body_size 1m;

    # A call's websocket carries audio both ways every 20 ms; the bot itself ends
    # a call at MAX_CALL_SECS (600 s default, 7200 s at most). The timeouts only
    # have to outlast that, and must not be nginx's 60 s default.
    proxy_read_timeout    7500s;
    proxy_send_timeout    7500s;
    proxy_connect_timeout 5s;
    proxy_buffering off;

    location /client/ {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /start {
        limit_req zone=live_agent_start burst=5 nodelay;

        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sessions/ {
        limit_req zone=live_agent_sessions burst=20 nodelay;

        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:7860;
        proxy_set_header Host $host;
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:7860;
        proxy_set_header Host $host;
    }

    # Telephony: the carrier's media stream. Carriers send no Origin header, and
    # the runner rejects a missing Origin once PIPECAT_ALLOWED_ORIGINS is set (the
    # bot unit sets it), so this route, and only this route, is given the
    # production origin here. `= /ws` and `/ws/` do not match the browser's /ws-client.
    location = /ws {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin            "https://hashmaker-ai-agent.duckdns.org";
    }
    location ^~ /ws/ {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin            "https://hashmaker-ai-agent.duckdns.org";
    }

    # Telephony: the carrier's call-status webhooks. The bot verifies the
    # carrier's signature before reading anything (off until SIGNALWIRE_SIGNING_KEY is set).
    location = /webhooks/telephony {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /metrics {
        return 404;
    }

    location /api/offer {
        return 404;
    }

    location / {
        return 404;
    }
}

# nginx, NO-DOMAIN STAGE ONLY: plain HTTP on the Elastic IP, health probes and nothing else.
#
#   sudo cp ~/deploy-aws/nginx-http-probe.conf /etc/nginx/sites-available/ai-agent-http-probe
#   sudo ln -sf /etc/nginx/sites-available/ai-agent-http-probe /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# What it is for: proving from outside that the instance, the security group, nginx
# and the bot are wired together, before a hostname and a certificate exist.
#
# What it deliberately does NOT forward, and why:
#   /client, /api/offer, /start, /sessions/, /ws-client
#       a browser gives a page the microphone only in a secure context (HTTPS), and
#       the HTTPS Vercel page cannot frame an http:// address (mixed content). Over
#       plain HTTP these routes cannot work; open, they would only let anyone spend
#       STT/LLM/TTS credit.
#   /ws, /webhooks/telephony
#       carriers require wss:// / https:// with a certificate that validates for a
#       hostname. Call audio must not cross the internet unencrypted either.
#   anything on 127.0.0.1:7900 (/app, /dashboard, /automation)
#       a login and a session cookie must not travel in clear. Vercel serves these.
#   /metrics
#       private, as in nginx-voice.conf.
#
# Remove this site when the HTTPS site (nginx-voice.conf) is installed:
#   sudo rm /etc/nginx/sites-enabled/ai-agent-http-probe && sudo systemctl reload nginx

# /readyz opens a database connection for every request, and the Supabase session
# pooler allows 15 clients in all (shared with Vercel). The key is a constant, so
# this is one limit for the whole server, not one per client address.
limit_req_zone $server_name zone=aiagent_probe:1m rate=30r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 1k;

    location = /healthz {
        limit_req zone=aiagent_probe burst=10 nodelay;
        limit_req_status 429;
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /readyz {
        limit_req zone=aiagent_probe burst=10 nodelay;
        limit_req_status 429;
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        return 404;
    }
}
